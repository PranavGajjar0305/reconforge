[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconforge"
version = "1.0.0"
description = "Modular, evidence-based attack surface intelligence platform for authorized reconnaissance"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "networkx>=3.0",
  "numpy>=1.26",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "dnspython>=2.4",
  "httpx>=0.27",
  "reportlab>=4.0",
  "cryptography>=41",
]

[project.optional-dependencies]
ai = ["anthropic>=0.60"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
reconforge = "reconforge.cli:main"

[project.entry-points."reconforge.modules"]
# Third-party packages can register additional modules here, e.g.
# mytool = "mypkg.module:MyToolModule"

[tool.setuptools.packages.find]
include = ["reconforge*"]

[tool.setuptools.package-data]
reconforge = ["reports/templates/*", "data/*", "data/wordlists/*", "api/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
